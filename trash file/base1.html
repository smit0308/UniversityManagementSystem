<!DOCTYPE html>
<html>
  <head>
    <title>PDEU</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0-beta1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-0evHe/X+R7YkIZDRvuzKMRqM+OrBnVFBL6DOitfPri4tjfHxaWutUpFmBp4vmVor" crossorigin="anonymous">
    <style>
      .flashes {
          margin: 0;
          padding: 0;
          list-style: none;
      }
      .alert {
          position: relative;
          opacity: 1;
          transition: opacity 0.5s linear, transform 0.5s linear;
      }
      .alert.fade-out {
          opacity: 0;
          transform: translateY(-20px);
      }
      #flash_notice {
          width: 400px;
          padding: 10px;
          background: #dbffca;
          color: #060;
          height: 30px;
          line-height: 30px;
          border: 1px solid #060;
          font-family: Arial, Helvetica, sans-serif;
          font-size: 12pt;
          margin-top: 30px;
          position: absolute;
          z-index: 1050;
          display: none;
      }
  </style>
  </head>
  <body>
        <div class="container">
          {% with messages = get_flashed_messages(with_categories=true) %}
              {% if messages %}
                  {% for category, message in messages %}
                      <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                          {{ message }}
                          <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                      </div>
                  {% endfor %}
              {% endif %}
          {% endwith %}
      </div>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js" integrity="sha384-oBqDVmMz4fnFO9gybBogGzpeh2F1K61hLhGvhS9KrpL8K/2T+hV5p4YL8pR7g5vB" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0-beta1/dist/js/bootstrap.min.js" integrity="sha384-pprn3073KE6tl6i4I6ARmdqfPIvHot6G1G5ERrW7P4hCJy5Smf8uc4OKfKniFN18" crossorigin="anonymous"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js" integrity="sha256-KyZXEAg3QhqLMpG8r+Knujsl5+5hb7O4h1Zx4bLP8l4=" crossorigin="anonymous"></script>
    <script>
        function flash_notice(message) {
            let notice = $('<div></div>').attr('id', 'flash_notice').html(message);
            $('body').append(notice);
            notice.css('left', ($('body').width() / 2) - (notice.width() / 2) + 'px');
            notice.css('top', $(window).scrollTop() + 'px');
            notice.fadeIn();
            function remove_notice() { 
                notice.fadeOut(function() { 
                    notice.remove(); 
                });
            }
            setTimeout(remove_notice, 5000);
        }
        
        // Function to fade out bootstrap flash messages after 5 seconds
        setTimeout(function() {
            let alerts = document.querySelectorAll('.alert');
            alerts.forEach(function(alert) {
                alert.classList.add('fade-out');
                setTimeout(() => {
                    alert.style.display = 'none';
                }, 500); // Match this duration with CSS transition duration
            });
        }, 5000); // 5000ms = 5 seconds

        // Displaying flash messages with custom function
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    flash_notice("{{ message }}");
                {% endfor %}
            {% endif %}
        {% endwith %}
    </script>
  </body>
</html>
