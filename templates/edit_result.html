<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0-beta1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-0evHe/X+R7YkIZDRvuzKMRqM+OrBnVFBL6DOitfPri4tjfHxaWutUpFmBp4vmVor" crossorigin="anonymous">
    <title>Edit Result</title>
</head>
<body>
    {% include 'nav.html' %}
    <div class="container mt-5">
        <br>
        <h1>Edit Result for {{ result.subject_name }}</h1>
        <form action="{{ url_for('edit_result', student_id=student_id, result_id=result._id) }}" method="post">
            <div class="mb-3">
                <label for="subject_name" class="form-label">Subject Name</label>
                <input type="text" class="form-control" id="subject_name" name="subject_name" value="{{ result.subject_name }}" required>
            </div>
            <div class="mb-3">
                <label for="total_marks" class="form-label">Total Marks</label>
                <input type="number" class="form-control" id="total_marks" name="total_marks" value="{{ result.total_marks }}" required>
            </div>
            <div class="mb-3">
                <label for="obtained_marks" class="form-label">Obtained Marks</label>
                <input type="number" class="form-control" id="obtained_marks" name="obtained_marks" value="{{ result.obtained_marks }}" required>
            </div>
            <button type="submit" class="btn btn-primary">Update Result</button>
        </form>
    </div>
    
    {% include 'footer.html' %}
</body>
</html>
